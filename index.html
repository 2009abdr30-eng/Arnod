<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0B" />
<title>Arnold Hybrid · 5-Day Lean Bulk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0A0B;
    --surface: #141416;
    --elevated: #1C1C1F;
    --border: #26262A;
    --text: #F5F5F7;
    --muted: #8E8E93;

    --accent: #C6F432;
    --success: #30D158;
    --warning: #FF9F0A;
    --danger: #FF453A;

    --chest: #FF5A5F;
    --back: #4C8DFF;
    --shoulders: #F5A623;
    --arms: #A78BFA;
    --legs: #2ECC71;
    --core: #F062B0;

    --r-card: 20px;
    --r-btn: 14px;
    --r-pill: 999px;

    --s1: 4px;  --s2: 8px;  --s3: 12px;
    --s4: 16px; --s5: 24px; --s6: 32px;

    --ease: cubic-bezier(.2,.7,.3,1);
    --dur: 180ms;

    --tabbar-h: 68px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(var(--tabbar-h) + 28px);
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:active { transform: scale(.97); }
  button, a { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- type ---------- */
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; margin: 0; }
  h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .label {
    font-size: 12px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  .muted { color: var(--muted); }
  .tiny { font-size: 12px; color: var(--muted); }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .topbar__in {
    max-width: 560px; margin: 0 auto; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand__mark {
    width: 34px; height: 34px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--accent); color: #0A0A0B;
  }
  .brand__name { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .brand__sub { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
    display: grid; place-items: center; color: var(--text);
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .icon-btn:hover { background: var(--elevated); border-color: #33333a; }

  /* ---------- structure ---------- */
  main { padding-top: var(--s5); }
  section { margin-bottom: var(--s6); }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: var(--s3);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: var(--s4);
  }
  .card + .card { margin-top: var(--s3); }
  .stack { display: grid; gap: var(--s3); }
  .row { display: flex; align-items: center; gap: var(--s3); }
  .row--between { justify-content: space-between; }
  .hr { height: 1px; background: var(--border); margin: var(--s4) 0; }

  /* ---------- chips / tags ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    padding: 4px 9px; border-radius: var(--r-pill);
    border: 1px solid var(--border); color: var(--muted);
    white-space: nowrap;
  }
  .chip__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip--chest { color: var(--chest); border-color: color-mix(in srgb, var(--chest) 35%, transparent); background: color-mix(in srgb, var(--chest) 12%, transparent); }
  .chip--back { color: var(--back); border-color: color-mix(in srgb, var(--back) 35%, transparent); background: color-mix(in srgb, var(--back) 12%, transparent); }
  .chip--shoulders { color: var(--shoulders); border-color: color-mix(in srgb, var(--shoulders) 35%, transparent); background: color-mix(in srgb, var(--shoulders) 12%, transparent); }
  .chip--arms { color: var(--arms); border-color: color-mix(in srgb, var(--arms) 35%, transparent); background: color-mix(in srgb, var(--arms) 12%, transparent); }
  .chip--legs { color: var(--legs); border-color: color-mix(in srgb, var(--legs) 35%, transparent); background: color-mix(in srgb, var(--legs) 12%, transparent); }
  .chip--core { color: var(--core); border-color: color-mix(in srgb, var(--core) 35%, transparent); background: color-mix(in srgb, var(--core) 12%, transparent); }
  .chip--accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .chip--rest { color: var(--muted); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: var(--r-btn); padding: 12px 16px;
    font-weight: 600; font-size: 14px;
    border: 1px solid var(--border); background: var(--elevated); color: var(--text);
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform 120ms var(--ease);
  }
  .btn:hover { background: #222227; }
  .btn--primary { background: var(--accent); color: #0A0A0B; border-color: var(--accent); }
  .btn--primary:hover { background: #d2ff45; }
  .btn--ghost { background: transparent; }
  .btn--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .btn--sm { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
  .btn--block { width: 100%; }

  /* ---------- hero / session ---------- */
  .hero-date { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .hero h1 { margin-bottom: 6px; }
  .hero__meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .session { padding: var(--s5) var(--s4); }
  .session__top { display: flex; align-items: center; gap: var(--s4); }
  .session__title { flex: 1; min-width: 0; }
  .session__title h2 { margin-top: 4px; }
  .ring { flex: none; position: relative; display: grid; place-items: center; }
  .ring__pct {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  }
  .ring__pct span { font-size: 10px; font-weight: 600; color: var(--muted); display: block; text-align: center; }

  /* ---------- exercise list ---------- */
  .block-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: var(--s5) 0 var(--s2);
  }
  .block-head:first-child { margin-top: 0; }
  .ex {
    border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
    padding: 12px;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .ex + .ex { margin-top: 8px; }
  .ex.is-done { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
  .ex__top { display: flex; align-items: flex-start; gap: 10px; }
  .slot {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    background: var(--elevated); color: var(--muted); border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .ex.is-done .slot { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .ex__name { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .ex__sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ex__body { margin-left: 36px; }
  .ex__img {
    flex: none; width: 64px; height: 64px; border-radius: 12px;
    background: #fff; object-fit: contain;
    border: 1px solid var(--border);
    padding: 3px;
  }
  @media (min-width: 480px) { .ex__img { width: 76px; height: 76px; } }
  .ex__nums { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .numcell { display: flex; align-items: baseline; gap: 4px; }
  .numcell b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .numcell span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .pips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pip {
    flex: 1 1 0; min-width: 44px; height: 30px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--elevated);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600; color: var(--muted);
    font-variant-numeric: tabular-nums;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .pip:hover { border-color: #3a3a42; }
  .pip[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 85%, #000);
    border-color: var(--accent); color: #0A0A0B;
  }
  .ex__drop {
    margin-left: auto; width: 28px; height: 28px; border-radius: 9px; flex: none;
    display: grid; place-items: center; color: var(--muted);
    border: 1px solid var(--border); background: var(--elevated);
    transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .ex__drop:hover { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }

  /* ---------- exercise picker ---------- */
  .pick {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 12px; margin-bottom: 8px; text-align: left;
    border-radius: 14px;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
    background: var(--surface);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 10%, transparent);
    animation: pickGlow 3.2s var(--ease) infinite;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .pick:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
  @keyframes pickGlow {
    0%, 100% { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 7%, transparent); }
    50% { box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 20%, transparent); }
  }
  .pick.is-locked {
    border-color: var(--border); background: var(--surface);
    box-shadow: none; animation: none; cursor: default; opacity: .5;
  }
  .pick.is-locked:hover { border-color: var(--border); background: var(--surface); }
  .pick__body { flex: 1; min-width: 0; }
  .pick__name { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .pick__meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pick__add {
    flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .pick.is-locked .pick__add { color: var(--muted); background: var(--elevated); }

  /* ---------- progress bars ---------- */
  .vol-row + .vol-row { margin-top: 14px; }
  .vol-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .vol-track {
    position: relative; height: 10px; border-radius: var(--r-pill);
    background: #1B1B1E; overflow: hidden;
  }
  .vol-band {
    position: absolute; top: 0; bottom: 0; left: 40%; width: 40%;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-left: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-right: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .vol-fill {
    position: absolute; top: 0; bottom: 0; left: 0; border-radius: var(--r-pill);
    transition: width 400ms var(--ease);
  }
  .vol-fill--indirect { opacity: .4; }
  .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
  .key { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .key i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ---------- plan cards ---------- */
  .daycard { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
  .daycard + .daycard { margin-top: 8px; }
  .daycard__btn {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 14px; text-align: left;
  }
  .daycard__dow {
    flex: none; width: 44px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .daycard__main { flex: 1; min-width: 0; }
  .daycard__name { font-weight: 600; font-size: 15px; }
  .daycard__meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .daycard.is-rest .daycard__name { color: var(--muted); font-weight: 500; }
  .daycard__chev { transition: transform var(--dur) var(--ease); color: var(--muted); }
  .daycard.is-open .daycard__chev { transform: rotate(180deg); }
  .daycard__panel { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .daycard.is-open .daycard__panel { display: block; }
  .mini-row { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .mini-row:last-child { border-bottom: 0; }
  .mini-row__slot {
    flex: none; width: 24px; font-size: 11px; font-weight: 700; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .daypicker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .daypick {
    display: grid; justify-items: center; gap: 5px;
    padding: 9px 0; border-radius: 12px;
    border: 1px solid var(--border); background: var(--elevated);
    font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted);
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .daypick:hover { border-color: #3a3a42; }
  .daypick[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--accent);
  }
  .mini-row__name { flex: 1; font-size: 13.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
  .dot--chest { background: var(--chest); }
  .dot--back { background: var(--back); }
  .dot--shoulders { background: var(--shoulders); }
  .dot--arms { background: var(--arms); }
  .dot--legs { background: var(--legs); }
  .dot--core { background: var(--core); }
  .mini-row__num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- streak / daily graph ---------- */
  .streak { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .streak__num {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 34px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .streak__num span { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .streak__flame {
    flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .chart { margin-top: 16px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart__labels { display: flex; justify-content: space-between; margin-top: 2px; }
  .hist { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .hist:first-child { padding-top: 0; }
  .hist:last-child { border-bottom: 0; padding-bottom: 0; }
  .hist__day { flex: none; width: 40px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hist__day b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--text); font-variant-numeric: tabular-nums; }
  .hist__body { flex: 1; min-width: 0; }
  .hist__name { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist__track { display: block; height: 6px; border-radius: var(--r-pill); background: #1B1B1E; margin-top: 6px; overflow: hidden; }
  .hist__track i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--accent); transition: width 400ms var(--ease); }
  .hist__pct { flex: none; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  .hist.is-rest .hist__name, .hist.is-rest .hist__pct { color: var(--muted); font-weight: 500; }
  .hist.is-idle .hist__pct { color: var(--muted); font-weight: 500; }

  /* ---------- body map ---------- */
  .bodymap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bodymap figure { margin: 0; }
  .bodymap svg { width: 100%; height: auto; display: block; }
  .bodymap figcaption { text-align: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .silhouette { fill: #191A1D; stroke: #2A2A2F; stroke-width: 1.2; }
  .muscle { transition: fill 300ms var(--ease), opacity 300ms var(--ease); }

  /* ---------- guide ---------- */
  .list { margin: 0; padding-left: 18px; }
  .list li { margin-bottom: 8px; color: var(--muted); }
  .list li b { color: var(--text); font-weight: 600; }
  .step { display: flex; gap: 12px; }
  .step + .step { margin-top: 14px; }
  .step__n {
    flex: none; width: 24px; height: 24px; border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .step__t { font-weight: 600; font-size: 14px; }
  .step__d { font-size: 13px; color: var(--muted); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 0 0 8px;
  }
  td { padding: 9px 0; border-top: 1px solid var(--border); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- settings ---------- */
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .setting:last-child { border-bottom: 0; padding-bottom: 0; }
  .setting:first-child { padding-top: 0; }
  .setting__t { font-weight: 500; font-size: 14px; }
  .setting__d { font-size: 12px; color: var(--muted); margin-top: 2px; max-width: 34ch; }
  .seg { display: inline-flex; background: var(--elevated); border: 1px solid var(--border); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button {
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--muted);
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #0A0A0B; }
  .switch {
    width: 46px; height: 28px; border-radius: var(--r-pill); flex: none;
    background: var(--elevated); border: 1px solid var(--border); position: relative;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%; background: #6E6E76;
    transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .switch[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 25%, transparent); border-color: var(--accent); }
  .switch[aria-pressed="true"]::after { transform: translateX(18px); background: var(--accent); }
  .stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--elevated); border: 1px solid var(--border); border-radius: 11px; }
  .stepper button { width: 34px; height: 32px; display: grid; place-items: center; color: var(--muted); border-radius: 9px; }
  .stepper button:hover { color: var(--text); }
  .stepper span { min-width: 44px; text-align: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- nutrition ---------- */
  .bodyweight { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bodyweight__val { font-size: 32px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .bodyweight__val small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .macro {
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px;
  }
  .macro__label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .macro__val { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .macro__val--accent { color: var(--accent); }
  .macro__note { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ---------- rest timer ---------- */
  .timer {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px));
    width: min(528px, calc(100% - 32px));
    background: var(--elevated); border: 1px solid #33333a;
    border-radius: 16px; padding: 10px 10px 10px 14px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
    z-index: 40;
    animation: rise 220ms var(--ease);
  }
  .timer[hidden] { display: none; }
  .timer__bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); border-radius: 0 2px 2px 0; transition: width 1s linear; }
  .timer__time { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .timer__label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .timer__actions { margin-left: auto; display: flex; gap: 6px; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---------- tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
  }
  .tabbar__in { max-width: 560px; height: var(--tabbar-h); margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .04em;
    transition: color var(--dur) var(--ease);
  }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"]:hover { color: var(--accent); }

  .empty { text-align: center; padding: var(--s5) var(--s4); }
  .empty i { color: var(--muted); }

  /* ---------- welcome ---------- */
  [hidden] { display: none !important; }
  .welcome {
    min-height: calc(100dvh - 210px); display: flex; flex-direction: column;
    justify-content: center; padding-bottom: var(--s6);
  }
  .welcome h1 { font-size: 36px; margin-top: 8px; }
  .welcome__grid { display: grid; gap: var(--s3); margin-top: var(--s5); }
  .lifter {
    display: flex; align-items: center; gap: var(--s4); width: 100%; text-align: left;
    padding: var(--s4); border: 1px solid var(--border); border-radius: 20px;
    background: var(--surface);
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform 120ms var(--ease);
  }
  .lifter:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: var(--elevated); }
  .lifter:active { transform: scale(.99); }
  .lifter__avatar {

    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .lifter__body { flex: 1; min-width: 0; }
  .lifter__name { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .lifter__meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .lifter__go { color: var(--muted); flex: none; transition: color var(--dur) var(--ease); }
  .lifter:hover .lifter__go { color: var(--accent); }
  .fade-in { animation: fade 260ms var(--ease); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- thanks card ---------- */
  .thanks {
    position: fixed; inset: 0; z-index: 60; padding: 20px;
    display: grid; place-items: center;
    background: rgba(10, 10, 11, .74);
    backdrop-filter: blur(6px);
    animation: fade 180ms var(--ease);
  }
  .thanks__card {
    width: min(380px, 100%); text-align: center;
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
    border-radius: 24px; padding: 28px 22px 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 40px color-mix(in srgb, var(--accent) 10%, transparent);
    animation: pop 260ms var(--ease);
  }
  .thanks__mark {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    color: var(--accent);
  }
  .thanks__card h2 { margin-top: 6px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .thanks__quote { font-size: 17px; font-weight: 500; line-height: 1.45; margin: 14px 0 10px; }
  .thanks__quote::before { content: "\201C"; color: var(--accent); }
  .thanks__quote::after { content: "\201D"; color: var(--accent); }
  .thanks__meta { margin-bottom: 18px; }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

/* =========================================================

   ========================================================= */
/* Two lifters share this plan; each keeps its own saved bodyweight. */
const PROFILES = {
  osama: { name: "Osama", kg: 72 },
  sharqawi: { name: "Sharqawi", kg: 87 }
};
const DEFAULT_WEIGHTS = { osama: 72, sharqawi: 87 };
const DEFAULT_REST_DAYS = [1, 5];                   // Monday & Friday

/* Each training day runs at most six exercises, picked by the lifter. */
const MAX_EX = 6;

const QUOTES = [
  "Discipline is choosing what you want most over what you want now.",
  "You do not have to be extreme, just consistent.",
  "Small daily wins compound into an unrecognizable you.",
  "The work you did today is the strength you will feel next month.",

  "Consistency is the shortcut nobody wants to take."

const STORE_KEY = "arnold-hybrid-v1";
const defaultState = () => ({
  welcomed: false,                                            // welcome screen dismissed
  checks: { osama: {}, sharqawi: {} },                        // per lifter: "d1:0:0" -> true
  picks: { osama: {}, sharqawi: {} },                         // per lifter, per day: exercise indexes chosen (max 6)
  history: { osama: {}, sharqawi: {} },                       // per lifter: "2026-11-23" -> % of that day's session logged
  lastQuote: -1,                                              // last thank-you quote shown
  settings: { units: "kg", beginner: false, rest: 90, autoTimer: true, profile: "osama", weights: { ...DEFAULT_WEIGHTS }, restDays: DEFAULT_REST_DAYS.slice() },
  tab: "today",
  openDay: null
});
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    const merged = {
      ...base, ...parsed,
      settings: { ...base.settings, ...(parsed.settings || {}) }
    };
    const ps = parsed.settings || {};
    const key = PROFILES[merged.settings.profile] ? merged.settings.profile : "osama";
    merged.settings.weights = { ...DEFAULT_WEIGHTS, ...(ps.weights || {}) };
    // Older saves stored a single bodyweight; carry over real edits, not the old 65 kg default.
    if (!ps.weights && typeof ps.bodyweight === "number" && isFinite(ps.bodyweight) && Math.abs(ps.bodyweight - 65) > 0.01) {
      merged.settings.weights[key] = ps.bodyweight;
    }
    // Logs are per lifter; move a legacy flat set log into the active profile.
    const checks = { osama: {}, sharqawi: {} };
    Object.keys(PROFILES).forEach((p) => {
      const saved = parsed.checks && parsed.checks[p];
      if (saved && typeof saved === "object") checks[p] = { ...saved };
    });
    if (parsed.checks && typeof parsed.checks === "object") {
      Object.keys(parsed.checks).forEach((k) => {
        if (k.indexOf(":") > -1 && parsed.checks[k]) checks[key][k] = parsed.checks[k];
      });
    }
    // Sets used to be stored as a bare `true`; stamp them so the graph can date them.
    const now = Date.now();
    Object.keys(checks).forEach((p) => Object.keys(checks[p]).forEach((k) => {
      if (checks[p][k] === true) checks[p][k] = now;
    }));
    merged.checks = checks;
    // Picks are per lifter. Older saves stored one flat list shared by both.
    const rawPicks = parsed.picks && typeof parsed.picks === "object" ? parsed.picks : {};
    const shared = Object.keys(rawPicks).some((k) => Array.isArray(rawPicks[k])) ? rawPicks : null;
    merged.picks = { osama: {}, sharqawi: {} };
    Object.keys(PROFILES).forEach((p) => {
      const own = !shared && rawPicks[p] ? rawPicks[p] : null;
      SESSIONS.forEach((day) => {
        const saved = own ? own[day.id] : shared ? shared[day.id] : null;
        if (Array.isArray(saved)) {
          merged.picks[p][day.id] = cleanPicks(saved, day);
          return;
        }
        // First run for this lifter: keep the exercises they already logged, then fill to six.
        const all = day.ex.map((_, i) => i);
        const logged = Object.keys(checks[p])
          .map((key) => key.split(":"))
          .filter(([d, i]) => d === day.id && all.includes(Number(i)))
          .map(([, i]) => Number(i));
        merged.picks[p][day.id] = cleanPicks(logged.concat(all), day);
      });
    });
    // Daily completion history, per lifter.
    merged.history = { osama: {}, sharqawi: {} };
    Object.keys(PROFILES).forEach((p) => {
      const saved = parsed.history && parsed.history[p];
      if (!saved || typeof saved !== "object") return;
      Object.keys(saved).forEach((k) => {
        const v = saved[k];
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof v === "number" && isFinite(v)) {
          merged.history[p][k] = Math.min(100, Math.max(0, Math.round(v)));
        }
      });
    });
    return merged;
  } catch (e) {
    return defaultState();
  }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* =========================================================
   HELPERS
   ========================================================= */
const byId = (id) => SESSIONS.find((d) => d.id === id);
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];          // Monday-first
const TRAINING_ORDER = ["d1", "d2", "d3", "d5", "d6"];
const REST_SLOTS = 2;

function restDows() {
  const r = state.settings.restDays;
  if (!Array.isArray(r) || !r.length) return DEFAULT_REST_DAYS.slice();
  return r.slice(0, REST_SLOTS);
}

function profileKey() {
  return PROFILES[state.settings.profile] ? state.settings.profile : "osama";
}

function bodyweightKg() {
  const p = profileKey();
  const w = state.settings.weights && state.settings.weights[p];
  return typeof w === "number" && isFinite(w) && w > 0 ? w : PROFILES[p].kg;
}

function setBodyweightKg(kg) {
  if (!state.settings.weights) state.settings.weights = { ...DEFAULT_WEIGHTS };
  state.settings.weights[profileKey()] = kg;
}

function displayWeight(kg, units) {
  return units === "lb" ? Math.round(kg * 2.20462) + " lb" : kg + " kg";
}

function checksFor(p = profileKey()) {
  if (!state.checks || typeof state.checks !== "object") state.checks = { osama: {}, sharqawi: {} };
  if (!state.checks[p] || typeof state.checks[p] !== "object") state.checks[p] = {};
  return state.checks[p];
}

function loggedCount(p) {
  const log = state.checks && state.checks[p] ? state.checks[p] : {};
  return Object.keys(log).filter((k) => log[k]).length;
}

/* Five sessions slide onto the non-rest weekdays, in plan order. */
function getSchedule() {
  const rests = restDows();
  const free = WEEK_ORDER.filter((d) => !rests.includes(d));
  const sessions = TRAINING_ORDER.map(byId);
  return WEEK_ORDER.map((dow) => {
    const i = free.indexOf(dow);
    return {
      dow,
      rest: i === -1 || i >= sessions.length,
      session: i > -1 ? sessions[i] : null
    };
  });
}

function sessionOn(dow) {
  const entry = getSchedule().find((e) => e.dow === dow);
  if (!entry || entry.rest) {
    return { id: "rest-" + dow, dow, rest: true, name: "Rest / Active Recovery", tag: "Recovery" };
  }
  return { ...entry.session, dow };
}

const todaySession = () => sessionOn(new Date().getDay());
const nextTrainingDay = (fromDow) => {
  for (let i = 1; i <= 7; i++) {
    const s = sessionOn((fromDow + i) % 7);
    if (!s.rest) return s;
  }
  return sessionOn(WEEK_ORDER[0]);
};
const setCount = (ex) => (state.settings.beginner && ex.sets === 3 ? 2 : ex.sets);

/* Picked exercises stay in plan order so the day reads top to bottom. */
function cleanPicks(list, day) {
  return list
    .filter((i) => Number.isInteger(i) && day.ex[i])
    .filter((i, idx, arr) => arr.indexOf(i) === idx)
    .slice(0, MAX_EX)
    .sort((a, b) => a - b);
}
function picksFor(dayId, p = profileKey()) {
  const day = byId(dayId);
  if (!day) return [];
  const saved = state.picks && state.picks[p] ? state.picks[p][dayId] : null;
  return Array.isArray(saved) ? saved : day.ex.slice(0, MAX_EX).map((_, i) => i);
}
function sessionTotal(day) {
  return picksFor(day.id).reduce((n, i) => n + (day.ex[i] ? setCount(day.ex[i]) : 0), 0);
}
const isChecked = (dayId, i, s) => !!checksFor()[dayId + ":" + i + ":" + s];
function doneSets(day) {
  let n = 0;
  picksFor(day.id).forEach((i) => {
    const ex = day.ex[i];
    if (!ex) return;
    for (let s = 0; s < setCount(ex); s++) if (isChecked(day.id, i, s)) n++;
  });
  return n;
}
function sessionComplete(day) {
  const picks = picksFor(day.id);
  const total = sessionTotal(day);
  return picks.length === Math.min(MAX_EX, day.ex.length) && total > 0 && doneSets(day) === total;
}

/* ---------- daily completion history ---------- */
const dayKey = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

function historyFor(p = profileKey()) {
  if (!state.history || typeof state.history !== "object") state.history = { osama: {}, sharqawi: {} };
  if (!state.history[p] || typeof state.history[p] !== "object") state.history[p] = {};
  return state.history[p];
}

/* Percent per date comes from the timestamp on each logged set, so days the app stayed closed still count. */
function syncHistory() {
  const h = historyFor();
  const log = checksFor();
  const todayKey = dayKey(new Date());
  const groups = {};
  Object.keys(log).forEach((key) => {
    const at = log[key];
    if (typeof at !== "number") return;              // older saves stored a bare true, with no date
    const dayId = key.split(":")[0];
    if (!byId(dayId)) return;
    const k = dayKey(new Date(at));
    if (!groups[k]) groups[k] = { sets: 0, days: [] };
    groups[k].sets++;
    if (groups[k].days.indexOf(dayId) === -1) groups[k].days.push(dayId);
  });
  Object.keys(groups).forEach((k) => {
    const g = groups[k];
    const total = g.days.reduce((n, id) => n + sessionTotal(byId(id)), 0);
    h[k] = total ? Math.min(100, pct(g.sets, total)) : 0;
  });
  // Today with nothing logged is in progress, not a recorded day.
  if (!groups[todayKey] && h[todayKey] !== undefined) delete h[todayKey];
}

/* Last n calendar days, starting no earlier than the first recorded day. */
function chartDays(n, fromFirst = true) {
  const h = historyFor();
  const today = new Date();
  today.setHours(12, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - (n - 1));
  const keys = Object.keys(h).sort();
  const first = keys.length ? new Date(keys[0] + "T12:00:00") : today;
  const from = fromFirst && first > start ? first : start;
  const days = [];
  for (const d = new Date(from); d <= today; d.setDate(d.getDate() + 1)) {
    const sched = sessionOn(d.getDay());
    days.push({ date: new Date(d), key: dayKey(d), pct: h[dayKey(d)] || 0, rest: sched.rest, name: sched.name });
  }
  return days;
}

/* A streak counts trained days; rest days are skipped rather than breaking it. */
function streakStats() {
  const h = historyFor();
  const trained = (d) => (h[dayKey(d)] || 0) > 0;
  const today = new Date();
  today.setHours(12, 0, 0, 0);

  let current = 0;
  const cursor = new Date(today);
  if (!sessionOn(cursor.getDay()).rest && !trained(cursor)) cursor.setDate(cursor.getDate() - 1);
  for (let guard = 0; guard < 400; guard++) {
    if (sessionOn(cursor.getDay()).rest) { cursor.setDate(cursor.getDate() - 1); continue; }
    if (!trained(cursor)) break;
    current++;
    cursor.setDate(cursor.getDate() - 1);
  }

  let best = current;
  const keys = Object.keys(h).sort();
  if (keys.length) {
    let run = 0;
    const end = new Date(today);
    for (const d = new Date(keys[0] + "T12:00:00"); d <= end; d.setDate(d.getDate() + 1)) {
      if (sessionOn(d.getDay()).rest) continue;
      run = trained(d) ? run + 1 : 0;
      if (run > best) best = run;
    }
  }
  return { current, best };
}

/* Catmull-Rom through the points, so the daily line reads as one smooth curve. */
function smoothPath(pts, top, bottom) {
  if (pts.length < 2) return "";
  const clampY = (y) => Math.min(bottom, Math.max(top, y));
  let d = "M" + pts[0][0] + "," + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, clampY(p1[1] + (p2[1] - p0[1]) / 6)];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, clampY(p2[1] - (p3[1] - p1[1]) / 6)];
    d += " C" + c1[0].toFixed(1) + "," + c1[1].toFixed(1) +
      " " + c2[0].toFixed(1) + "," + c2[1].toFixed(1) +
      " " + p2[0] + "," + p2[1];
  }
  return d;
}

function viewStreak() {
  const h = historyFor();
  const days = chartDays(14);
  const { current, best } = streakStats();
  const todayKey = dayKey(new Date());
  const trainedToday = (h[todayKey] || 0) > 0;
  const recent = chartDays(7, false).slice().reverse();
  const trained7 = recent.filter((d) => (h[d.key] || 0) > 0).length;

  const W = 320, H = 116, padX = 8, padT = 10, padB = 6;
  const plotBottom = H - padB;
  const points = days.filter((d) => !d.rest);   // rest days are not 0% training days
  const pts = points.map((d, i) => {
    const x = points.length === 1 ? W / 2 : padX + (i * (W - padX * 2)) / (points.length - 1);
    const y = padT + (1 - d.pct / 100) * (plotBottom - padT);
    return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
  });
  const line = smoothPath(pts, padT, plotBottom);
  const area = line
    ? line + " L" + pts[pts.length - 1][0] + "," + plotBottom + " L" + pts[0][0] + "," + plotBottom + " Z"
    : "";
  const grid = [100, 50, 0].map((v) => {
    const y = padT + (1 - v / 100) * (plotBottom - padT);
    return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#26262A" stroke-width="1" stroke-dasharray="${v === 0 ? "0" : "3 4"}" />`;
  }).join("");
  const dots = pts.map((p, i) =>
    `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 3.4 : 2.2}" fill="${i === pts.length - 1 ? "var(--accent)" : "#0A0A0B"}" stroke="var(--accent)" stroke-width="1.6" />`
  ).join("");

  const chart = !Object.keys(h).length
    ? `<div class="empty" style="padding:20px 0"><div class="tiny">No sessions logged yet. Your first one starts the line.</div></div>`
    : `<div class="chart">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily completion percentage">
          <defs>
            <linearGradient id="streakFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#C6F432" stop-opacity=".26" />
              <stop offset="100%" stop-color="#C6F432" stop-opacity="0" />
            </linearGradient>
          </defs>
          ${grid}
          ${area ? `<path d="${area}" fill="url(#streakFill)" />` : ""}
          ${line ? `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />` : ""}
          ${dots}
        </svg>
        <div class="chart__labels tiny">
          <span>${days[0].date.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
          <span>${days.length} day${days.length === 1 ? "" : "s"}</span>
          <span>Today</span>
        </div>
      </div>`;

  const rows = recent.map((d) => {
    const v = h[d.key];
    const known = typeof v === "number";
    return `
      <div class="hist ${d.rest ? "is-rest" : ""} ${known ? "" : "is-idle"}">
        <span class="hist__day">${DAY_NAMES[d.date.getDay()].slice(0, 3)}<b>${pad(d.date.getDate())}</b></span>
        <span class="hist__body">
          <span class="hist__name">${d.rest ? "Rest / Active Recovery" : d.name}</span>
          <span class="hist__track"><i style="width:${known ? Math.max(v, 2) : 0}%"></i></span>
        </span>
        <span class="hist__pct">${known ? v + "%" : "—"}</span>
      </div>`;
  }).join("");

  return `
    <section style="margin-top:24px">
      <div class="section-head"><span class="label">Training streak</span><span class="tiny">last 14 days</span></div>
      <div class="card">
        <div class="streak">
          <div>
            <div class="streak__num">${current}<span>day${current === 1 ? "" : "s"} in a row</span></div>
            <div class="tiny" style="margin-top:2px">Best ${best} · ${trained7} of the last 7 days trained</div>
          </div>
          <div class="streak__flame"><i data-lucide="flame" width="22" height="22"></i></div>
        </div>
        ${chart}
        <p class="tiny" style="margin-top:12px">${trainedToday ? "Today is banked. Keep the line climbing." : "One set today and the curve keeps rising."} Rest days never break it.</p>
      </div>
    </section>

    <section>
      <div class="section-head"><span class="label">Everyday %</span><span class="tiny">last 7 days</span></div>
      <div class="card">${rows}</div>
      <p class="tiny" style="margin-top:12px">Each bar is the share of that day's picked session you logged. Past days keep their score, so the curve only moves when you train.</p>
    </section>`;
}
const fmtDate = () =>
  new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
const pad = (n) => (n < 10 ? "0" + n : "" + n);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
function volTotal(v) { return v.direct + v.indirect; }
function volFor(name) { return VOLUME.find((v) => v.name === name) || { direct: 0, indirect: 0 }; }

function ring(value, size, stroke, color) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (Math.min(100, Math.max(0, value)) / 100) * c;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#26262A" stroke-width="${stroke}" />
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .5s var(--ease)" />
  </svg>`;
}

function chip(m, label) {
  return `<span class="chip chip--${m}"><span class="chip__dot"></span>${label}</span>`;
}
const MUSCLE_NAMES = { chest: "Chest", back: "Back", shoulders: "Shoulders", arms: "Arms", legs: "Legs", core: "Core" };
function muscleName(m) { return MUSCLE_NAMES[m] || m; }
function muscleChips(muscles) {
  return muscles.map((m) => chip(m, muscleName(m))).join("");
}

/* =========================================================
   VIEWS
   ========================================================= */

/* Back-to-back supersets touch, so pair them in order inside each run of marked exercises. */
function pairIndex(day, i) {
  if (!day.ex[i] || !day.ex[i].ss) return -1;
  let start = i;
  while (start > 0 && day.ex[start - 1].ss) start--;
  const pos = i - start;
  const partner = start + (pos % 2 === 0 ? pos + 1 : pos - 1);
  return day.ex[partner] && day.ex[partner].ss ? partner : -1;
}

function renderExercise(day, ex, i, num, pairNum) {
  const sets = setCount(ex);
  let done = 0;
  let pips = "";
  for (let s = 0; s < sets; s++) {
    const on = isChecked(day.id, i, s);
    if (on) done++;
    pips += `<button class="pip" data-action="set" data-day="${day.id}" data-i="${i}" data-s="${s}"
      aria-pressed="${on}" aria-label="Set ${s + 1}">${s + 1}</button>`;
  }
  const complete = done === sets;
  // Only shown when both halves of the pair are in today's session (pairNum is 0 otherwise).
  const ssChip = pairNum
    ? `<span class="chip chip--accent">Superset ${Math.min(num, pairNum)} + ${Math.max(num, pairNum)}</span>`
    : "";
  const img = EX_IMAGES[ex.name];
  const thumb = img
    ? `<img class="ex__img" src="img/${img}.webp" alt="" width="76" height="76" loading="lazy" decoding="async" onerror="this.style.display='none'">`
    : "";
  return `
    <div class="ex ${complete ? "is-done" : ""}">
      <div class="ex__top">
        <div class="slot">${num}</div>
        <div class="ex__body" style="flex:1;min-width:0">
          <div class="ex__name">${ex.name}</div>
          <div class="ex__sub">${ex.src} · RIR ${ex.rir} · rest ${ex.rest}</div>
          <div class="ex__nums">
            <span class="numcell"><b>${sets}</b><span>sets</span></span>
            <span class="numcell"><b>${ex.reps}</b><span>reps</span></span>
            ${chip(ex.m, muscleName(ex.m))}
            ${ssChip}
            <button class="ex__drop" data-action="unpick" data-day="${day.id}" data-i="${i}" aria-label="Remove ${ex.name}">
              <i data-lucide="x" width="14" height="14"></i>
            </button>
          </div>
          <div class="pips">${pips}</div>
        </div>
        ${thumb}
      </div>
    </div>
  `;
}

function renderPick(day, ex, i, locked) {
  const sets = setCount(ex);
  return `
    <button class="pick ${locked ? "is-locked" : ""}" data-action="pick" data-day="${day.id}" data-i="${i}"
      ${locked ? 'disabled aria-disabled="true"' : `aria-label="Add ${ex.name}"`}>
      <span class="dot dot--${ex.m}" aria-hidden="true"></span>
      <span class="pick__body">
        <span class="pick__name">${ex.name}</span>
        <span class="pick__meta">${sets} × ${ex.reps} · ${ex.src}</span>
      </span>
      <span class="pick__add"><i data-lucide="${locked ? "lock" : "plus"}" width="16" height="16"></i></span>
    </button>`;
}

function viewProgress() {
  const days = getSchedule().filter((e) => !e.rest).map((e) => ({ ...e.session, dow: e.dow }));
  const weekSets = days.reduce((n, d) => n + sessionTotal(d), 0);
  let weekDone = 0;
  days.forEach((d) => { weekDone += doneSets(d); });
  const finished = days.filter((d) => doneSets(d) === sessionTotal(d)).length;
  const p = pct(weekDone, weekSets);

  const dayBars = days.map((d) => {
    const t = sessionTotal(d);
    const dn = doneSets(d);
    const dp = pct(dn, t);
    return `
      <div class="vol-row">
        <div class="vol-head">
          <span class="tiny" style="color:var(--text);font-weight:500">${d.name}</span>
          <span class="tiny num">${dn}/${t}</span>

        </div>

  }).join("");

  return `
    <div class="hero fade-in">
      <div class="label">Progress · ${PROFILES[profileKey()].name}</div>

const MUSCLE_COLOR = {
  chest: "#FF5A5F", back: "#4C8DFF", shoulders: "#F5A623",
  arms: "#A78BFA", legs: "#2ECC71", core: "#F062B0"
};
function muscleOpacity(key) {
  const map = {
    chest: "Chest", shoulders: "Shoulders", biceps: "Biceps", triceps: "Triceps",
    forearms: "Forearms", abs: "Abs", quads: "Quads", hams: "Hamstrings & Glutes",
    glutes: "Hamstrings & Glutes", calves: "Calves",
    traps: "Back", lats: "Back", midback: "Back", erectors: "Back", delts: "Shoulders"
  };
  const name = map[key];
  const v = name ? volFor(name) : null;
  const total = v ? volTotal(v) : 0;
  return (0.18 + Math.min(1, total / 22) * 0.72).toFixed(2);
}
function m(key, d, cls) {
  return `<path id="${cls === "b" ? "b-" : ""}${key}" class="muscle" d="${d}"
    fill="${MUSCLE_COLOR[muscleColorKey(key)]}" opacity="${muscleOpacity(key)}"></path>`;
}
function muscleColorKey(key) {
  if (["chest"].includes(key)) return "chest";
  if (["biceps", "triceps", "forearms"].includes(key)) return "arms";
  if (["quads", "hams", "glutes", "calves"].includes(key)) return "legs";
  if (["abs", "obliques"].includes(key)) return "core";
  if (["shoulders", "delts"].includes(key)) return "shoulders";
  return "back";
}

function unitWeight(str) {
  // Week-1 loads are authored in kg; show lb equivalents when selected.
  if (state.settings.units === "kg") return str;
  return str.replace(/([\d.]+)(?:–([\d.]+))?\s*kg/g, (_, a, b) => {
    const lb = (n) => Math.round((parseFloat(n) * 2.20462) / 5) * 5;
    return b ? lb(a) + "–" + lb(b) + " lb" : lb(a) + " lb";
  }).replace("20 kg bar", "45 lb bar");
}

function nutritionTargets() {
  const bw = bodyweightKg();
  const maint = Math.round(bw * 33);
  const daily = maint + 350;
  const range = (lo, hi) => Math.round(lo * bw) + "–" + Math.round(hi * bw);
  return { bw, maint, daily, protein: range(1.6, 2.2), carbs: range(4, 6), fat: range(0.6, 0.9) };
}

function gainTarget() {
  const kg = bodyweightKg() * 0.02;
  return state.settings.units === "kg"
    ? kg.toFixed(1) + " kg"
    : (kg * 2.20462).toFixed(1) + " lb";
}

/* =========================================================
   RENDER
   ========================================================= */
const TABS = [
  { id: "today", label: "Today", icon: "dumbbell" },
  { id: "plan", label: "Plan", icon: "calendar-days" },
  { id: "progress", label: "Progress", icon: "bar-chart-3" },
  { id: "guide", label: "Guide", icon: "book-open" },
  { id: "settings", label: "Settings", icon: "settings" }
];

function render() {
  const view = document.getElementById("view");
  const onboarded = !!state.welcomed;
  document.getElementById("tabbar").hidden = !onboarded;
  document.getElementById("bellBtn").hidden = !onboarded;

  if (!onboarded) {
    view.innerHTML = viewWelcome();
    document.getElementById("brandSub").textContent = "Pick a lifter to begin";
    if (window.lucide) window.lucide.createIcons();
    save();
    return;
  }

  syncHistory();
  const data = {
    today: viewToday,
    plan: viewPlan,
    progress: viewProgress,
    guide: viewGuide,
    settings: viewSettings
  };
  view.innerHTML = (data[state.tab] || viewToday)();
  document.getElementById("tabs").innerHTML = TABS.map((t) => `
    <button class="tab" role="tab" data-action="tab" data-tab="${t.id}" aria-selected="${state.tab === t.id}">
      <i data-lucide="${t.icon}" width="22" height="22"></i>
      <span>${t.label}</span>
    </button>`).join("");
  document.getElementById("brandSub").textContent =
    PROFILES[profileKey()].name + " · " +
    (state.settings.beginner ? "Beginner block · 2× frequency" : "5-day · 2× frequency");
  if (window.lucide) window.lucide.createIcons();
  save();
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;

  if (a === "tab") {
    state.tab = el.dataset.tab;
    window.scrollTo(0, 0);
    render();
    return;
  }

  if (a === "set") {
    const day = byId(el.dataset.day);
    const key = el.dataset.day + ":" + el.dataset.i + ":" + el.dataset.s;
    const log = checksFor();
    const wasOn = !!log[key];
    const wasComplete = day ? sessionComplete(day) : false;
    if (wasOn) delete log[key];
    else log[key] = Date.now();
    render();
    if (!wasOn && state.settings.autoTimer) startTimer(state.settings.rest);
    if (!wasOn && day && !wasComplete && sessionComplete(day)) showThanks(day);
    return;
  }

  if (a === "pick") {
    const day = byId(el.dataset.day);
    const i = Number(el.dataset.i);
    if (!day) return;
    const picks = picksFor(day.id);
    if (picks.length >= MAX_EX || picks.includes(i) || !day.ex[i]) return;
    state.picks[profileKey()][day.id] = picks.concat(i).sort((x, y) => x - y);
    render();
    return;
  }

  if (a === "unpick") {
    const day = byId(el.dataset.day);
    const i = Number(el.dataset.i);
    if (!day) return;
    const ex = day.ex[i];
    if (!ex) return;
    const log = checksFor();
    let logged = 0;
    for (let s = 0; s < setCount(ex); s++) if (log[day.id + ":" + i + ":" + s]) logged++;
    if (logged && !confirm(
      "Remove " + ex.name + "? " + logged + " logged set" + (logged === 1 ? "" : "s") +
      " for " + PROFILES[profileKey()].name + " will be deleted."
    )) return;
    state.picks[profileKey()][day.id] = picksFor(day.id).filter((x) => x !== i);
    // Logged sets of a removed exercise go with it.
    Object.keys(log).forEach((k) => { if (k.indexOf(day.id + ":" + i + ":") === 0) delete log[k]; });
    render();
    return;
  }

  if (a === "thanks-close") {
    if (el.id === "thanks" && e.target !== el) return;
    hideThanks();
    return;
  }

  if (a === "rest-day") {
    const dow = Number(el.dataset.dow);
    const rests = restDows().slice();
    if (rests.includes(dow)) return;
    rests.push(dow);
    while (rests.length > REST_SLOTS) rests.shift();
    state.settings.restDays = rests;
    render();
    return;
  }

  if (a === "toggle-day") {
    const id = el.dataset.day;
    state.openDay = state.openDay === id ? null : id;
    render();
    return;
  }

  if (a === "go-plan") {
    state.tab = "plan";
    state.openDay = nextTrainingDay(new Date().getDay()).id;
    render();
    return;
  }

  if (a === "units") {
    state.settings.units = el.dataset.value;
    render();
    return;
  }
  if (a === "bw-up" || a === "bw-down") {
    const step = state.settings.units === "lb" ? 0.4536 : 1;
    const delta = a === "bw-up" ? step : -step;
    const next = Math.min(200, Math.max(35, Math.round((bodyweightKg() + delta) * 10) / 10));
    setBodyweightKg(next);
    render();
    return;
  }
  if (a === "profile") {
    if (PROFILES[el.dataset.value]) state.settings.profile = el.dataset.value;
    render();
    return;
  }
  if (a === "pick-profile") {
    const v = el.dataset.value;
    if (PROFILES[v]) {
      state.settings.profile = v;
      state.welcomed = true;
      state.tab = "today";
      window.scrollTo(0, 0);
      render();
    }
    return;
  }
  if (a === "bw-reset") {
    setBodyweightKg(PROFILES[profileKey()].kg);
    render();
    return;
  }
  if (a === "toggle-beginner") {
    state.settings.beginner = !state.settings.beginner;
    render();
    return;
  }
  if (a === "toggle-auto") {
    state.settings.autoTimer = !state.settings.autoTimer;
    render();
    return;
  }
  if (a === "rest-up" || a === "rest-down") {
    const step = a === "rest-up" ? 15 : -15;
    state.settings.rest = Math.min(300, Math.max(30, state.settings.rest + step));
    render();
    return;
  }
  if (a === "reset") {
    if (confirm("Clear every logged set for " + PROFILES[profileKey()].name + "? The other lifter's log is kept.")) {
      state.checks[profileKey()] = {};
      render();
    }
    return;
  }

  if (a === "timer-add") { addTime(15); return; }
  if (a === "timer-skip") { stopTimer(); return; }
});

document.getElementById("bellBtn").addEventListener("click", () => {
  if (timer.remaining > 0) stopTimer();
  else startTimer(state.settings.rest);
});

/* =========================================================
   REST TIMER
   ========================================================= */
const timer = { total: 0, remaining: 0, handle: null };

function paintTimer() {
  const el = document.getElementById("timer");
  const label = document.getElementById("timerTime");
  const bar = document.getElementById("timerBar");
  if (timer.remaining <= 0) {
    el.hidden = true;
    return;
  }
  el.hidden = false;
  label.textContent = Math.floor(timer.remaining / 60) + ":" + pad(timer.remaining % 60);
  bar.style.width = (timer.total ? (timer.remaining / timer.total) * 100 : 0) + "%";
}

function startTimer(seconds) {
  stopTimer();
  timer.total = seconds;
  timer.remaining = seconds;
  paintTimer();
  timer.handle = setInterval(() => {
    timer.remaining -= 1;
    if (timer.remaining <= 0) {
      stopTimer(true);
      return;
    }
    paintTimer();
  }, 1000);
}

function addTime(sec) {
  if (timer.remaining <= 0) { startTimer(state.settings.rest); return; }
  timer.total += sec;
  timer.remaining += sec;
  paintTimer();
}

function stopTimer(done) {
  if (timer.handle) clearInterval(timer.handle);
  timer.handle = null;
  timer.remaining = 0;
  timer.total = 0;
  paintTimer();
  if (done && navigator.vibrate) navigator.vibrate(180);
}

/* =========================================================
   BOOT
   ========================================================= */
/* Keep the open screen on the real calendar date: past midnight, or after a timezone change, re-render. */
let calendarStamp = dayKey(new Date()) + "|" + new Date().getTimezoneOffset();

function syncCalendar() {
  const now = new Date();
  const stamp = dayKey(now) + "|" + now.getTimezoneOffset();
  if (stamp === calendarStamp) return;
  calendarStamp = stamp;
  stopTimer();
  render();
}

setInterval(syncCalendar, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncCalendar(); });
window.addEventListener("focus", syncCalendar);

render();
</script>
